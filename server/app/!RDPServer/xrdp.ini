; RDPServer's settings for libxrdp (the [globals] section xrdp reads).
[globals]
; Standard RDP Security (RC4) until AcornSSL can act as a TLS server.
security_layer=rdp
crypt_level=high
bitmap_cache=true
bitmap_compression=true
bulk_compression=true
max_bpp=32
use_fastpath=both
allow_channels=false
allow_multimon=false
require_credentials=false
new_cursors=true
