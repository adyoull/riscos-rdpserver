; RDPServer's settings for libxrdp (the [globals] section xrdp reads).
[globals]
; TLS 1.2 (mbedTLS, in the module) for clients that ask for it, with a
; self-signed certificate made from the server's key (Choices:RDPServer
; key.pem and cert.pem); Standard RDP Security (RC4) for the rest.
security_layer=negotiate
certificate=
key_file=
crypt_level=high
bitmap_cache=true
bitmap_compression=true
bulk_compression=true
max_bpp=32
use_fastpath=both
; rdpsnd for sound (0.2-test11); other channels the client asks for are joined and ignored
allow_channels=true
allow_multimon=false
require_credentials=false
new_cursors=true
; Keep-alive (since 0.2-rc2), for TLS clients that take it: heartbeats every
; 5 s, so the client notices if this computer stops answering and connects
; again by itself; and network checks, so a client that has gone without
; closing its connection is noticed and doesn't keep others out.
keepalive=true
